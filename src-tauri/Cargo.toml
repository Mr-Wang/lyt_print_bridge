[package]
name = "lyt_print_bridge"
version = "0.1.1"
description = "Local PDF print bridge for browser initiated jobs"
authors = ["wangyang"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.71"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "^1.5", features = [] }

[dependencies]
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "^1.7", features = ["shell-open", "fs-all", "path-all", "icon-ico", "system-tray"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.19.1"
windows = { version = "0.39.0", features = ["Win32_Foundation", "Win32_System_WinRT"] }
