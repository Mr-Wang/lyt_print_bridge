name: Domestic self-hosted build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UOS or Kylin x64 deb
            artifact_name: domestic-linux-x64
            target: x86_64-unknown-linux-gnu
            runs_on: [self-hosted, linux, X64, domestic]
          - name: UOS or Kylin ARM64 deb
            artifact_name: domestic-linux-arm64
            target: aarch64-unknown-linux-gnu
            runs_on: [self-hosted, linux, ARM64, domestic]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Build deb on target machine
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles deb

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
